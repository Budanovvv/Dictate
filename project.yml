name: Dictate
options:
  bundleIdPrefix: com.valentynbudanov
  deploymentTarget:
    macOS: "15.0"
  createIntermediateGroups: true

packages:
  WhisperKit:
    url: https://github.com/argmaxinc/WhisperKit
    from: "0.18.0"
  Sparkle:
    url: https://github.com/sparkle-project/Sparkle
    from: "2.6.0"
  # Silero VAD on CoreML (speech gate in front of Whisper). Apache-2.0;
  # the model itself is bundled from Resources/ — no runtime downloads.
  FluidAudio:
    url: https://github.com/FluidInference/FluidAudio
    from: "0.15.5"

targets:
  Dictate:
    type: application
    platform: macOS
    sources:
      - path: Sources
      - path: Resources/silero-vad-unified-256ms-v6.2.1.mlmodelc
        buildPhase: resources
        type: folder
      # The llama.cpp server, embedded as a helper executable and run as a
      # CHILD PROCESS (see LocalTextEngine for why it is a separate process and
      # not a linked library — the SIGABRT-on-every-quit scar in GRABLI).
      #
      # Contents/Helpers, which is where Apple puts non-.app helper
      # executables, and NOT Contents/Resources: an executable sitting in
      # Resources is a code object where the notary does not expect one.
      #
      # CodeSignOnCopy is what makes this survive notarization — the helper is
      # signed with the app's own identity as it is copied in, inheriting the
      # Release configuration's Developer ID identity, hardened runtime and
      # --timestamp. Same shape as the Sparkle helpers this app already ships
      # and notarizes.
      - path: Resources/llama-server
        buildPhase:
          copyFiles:
            destination: executables
            subpath: ../Helpers
        attributes: [CodeSignOnCopy]
    dependencies:
      - package: WhisperKit
      - package: Sparkle
      - package: FluidAudio
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.valentynbudanov.Dictate
        PRODUCT_NAME: Dictate
        MARKETING_VERSION: "3.1"
        # CFBundleVersion (what Sparkle compares) is injected at build time from
        # the git commit count — see build.sh. No hand-bumped counter to forget.
        INFOPLIST_FILE: Sources/Info.plist
        SWIFT_VERSION: "5.0"
        # ObjC shim: converts NSException from AVFoundation into NSError
        # (Swift can't catch ObjC exceptions) — see ObjCExceptionCatcher.
        SWIFT_OBJC_BRIDGING_HEADER: Sources/Dictate-Bridging-Header.h
        MACOSX_DEPLOYMENT_TARGET: "15.0"
        # Automatic signing; the Team is picked once in Xcode (Signing & Capabilities).
        CODE_SIGN_STYLE: Automatic
        DEVELOPMENT_TEAM: 3BN45AZPR2
        # Required for notarization:
        ENABLE_HARDENED_RUNTIME: YES
        # Hardened runtime requires an explicit microphone entitlement:
        CODE_SIGN_ENTITLEMENTS: Sources/Dictate.entitlements
        # No LSUIElement: the app is a REGULAR app (Dock icon by default);
        # main.swift sets the activation policy from the Show-in-Dock setting
        # at launch. (An LSUIElement key here under `settings:` never reached
        # the Info.plist anyway — xcodegen only reads `info:` for plist keys.)
      configs:
        # Release ships outside the App Store (DMG + Sparkle), so it must be
        # signed with the Developer ID Application cert and carry a secure
        # timestamp — that plus the hardened runtime above is what Apple's
        # notary service requires. Automatic signing picks "Apple Development"
        # for a plain build and would fail notarization, so Release pins the
        # Developer ID identity explicitly. Debug stays on Automatic for quick
        # local runs. build.sh builds Release, so ./build.sh --install already
        # produces exactly the signed artifact that ships.
        Release:
          CODE_SIGN_STYLE: Manual
          CODE_SIGN_IDENTITY: "Developer ID Application"
          OTHER_CODE_SIGN_FLAGS: "--timestamp"
          # Xcode injects com.apple.security.get-task-allow (lets a debugger
          # attach) into every build; the notary service rejects it. Release is
          # never debugged, so strip it — otherwise the main binary fails
          # notarization with "requests the get-task-allow entitlement".
          CODE_SIGN_INJECT_BASE_ENTITLEMENTS: NO

  # Unit tests: compile the tested sources directly (no TEST_HOST,
  # so the tests do not launch the GUI app and do not depend on TCC).
  DictateTests:
    type: bundle.unit-test
    platform: macOS
    sources:
      - path: Tests
      - path: Sources/Localization.swift
      - path: Sources/KeyNames.swift
      - path: Sources/Settings.swift
      # Pulled in by Settings.askProvider, whose type it defines.
      - path: Sources/APIKey.swift
      # The Ask conversation store — deliberately dependency-free (plain
      # Codable + FileManager) so its round-trip/cap/rename rules test here.
      - path: Sources/AskHistoryStore.swift
      # Pulled in by RecordingHUD, which the tests compile.
      - path: Sources/DesignSystem.swift
      # The portal home's facts — a pure rule, tested like every policy.
      - path: Sources/MeetingBriefPolicy.swift
      - path: Sources/LanguageList.swift
      - path: Sources/Replacements.swift
      - path: Sources/CommitEngine.swift
      - path: Sources/AudioRecorder.swift
      - path: Sources/AudioDevices.swift
      - path: Sources/DictationPolicy.swift
      - path: Sources/MeetingPolicy.swift
      # Pulled in by MeetingTitler, which the tests compile.
      - path: Sources/SectionCache.swift
      # The micro-cluster rule is dependency-free precisely so it can be tested
      # here: MeetingDiarizer itself imports FluidAudio and cannot come along.
      - path: Sources/MeetingSpeakerPolicy.swift
      # Which calendar event a recording belongs to — the risky half of naming
      # meetings from the calendar, and dependency-free so it can be tested
      # here (MeetingCalendar itself imports EventKit and stays out).
      - path: Sources/MeetingCalendarPolicy.swift
      # Tag normalisation and the header line they live on — pure text work,
      # and the vocabulary's only defence against drifting into synonyms.
      - path: Sources/MeetingTags.swift
      - path: Sources/MeetingArchive.swift
      - path: Sources/TranscriptCleanup.swift
      - path: Sources/MeetingSearch.swift
      # MeetingSearch translates a foreign-language query through the app's one
      # translation path rather than opening a second session of its own.
      - path: Sources/AppleTranslator.swift
      - path: Sources/TranscriptCopy.swift
      # The WAV plumbing of the dump/replay debug instruments: a dumped file
      # must be replayable by construction, and the round trip is the proof.
      - path: Sources/MeetingReplay.swift
      - path: Sources/MeetingTitler.swift
      # The generation engines the titler now goes through. Compiled in so the
      # filter tests keep testing the code the app actually runs — the filters
      # sit on the far side of this boundary and apply to every engine.
      - path: Sources/MeetingTextEngine.swift
      - path: Sources/LocalTextEngine.swift
      - path: Sources/Log.swift
      - path: Sources/WhisperEngine.swift
      - path: Sources/RecordingHUD.swift
      # The mark family RecordingHUD draws its state glyphs with.
      - path: Sources/FamilyGlyph.swift
      - path: Sources/ObjCExceptionCatcher.h
      - path: Sources/ObjCExceptionCatcher.m
    dependencies:
      - package: WhisperKit
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.valentynbudanov.DictateTests
        GENERATE_INFOPLIST_FILE: YES
        SWIFT_OBJC_BRIDGING_HEADER: Sources/Dictate-Bridging-Header.h
        CODE_SIGN_STYLE: Automatic
        DEVELOPMENT_TEAM: 3BN45AZPR2

schemes:
  Dictate:
    build:
      targets:
        Dictate: all
        DictateTests: [test]
    run:
      config: Debug
    test:
      config: Debug
      targets:
        - DictateTests
    profile:
      config: Release
    analyze:
      config: Debug
    archive:
      config: Release
